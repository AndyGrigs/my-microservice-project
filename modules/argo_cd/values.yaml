global:
  domain: argocd.example.com

server:
  service:
    type: LoadBalancer

  config:
    # Allow Argo CD to manage resources in all namespaces
    application.namespaces: "*"

  rbacConfig:
    policy.default: role:readonly

configs:
  params:
    # Disable insecure mode — always use TLS
    server.insecure: false

  cm:
    # Sync every 3 minutes
    timeout.reconciliation: 180s

repoServer:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

controller:
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
