{{- range .Values.repositories }}
apiVersion: v1
kind: Secret
metadata:
  name: repo-{{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: {{ .url }}
  {{- if .sshPrivateKey }}
  sshPrivateKey: {{ .sshPrivateKey | quote }}
  {{- end }}
---
{{- end }}
