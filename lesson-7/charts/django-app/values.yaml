image:
  repository: 765033947432.dkr.ecr.eu-central-1.amazonaws.com/django-app
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

config:
  djangoDebug: "1"
  djangoAllowedHosts: "*"
  djangoSecretKey: "my-secret-key-change-in-production"