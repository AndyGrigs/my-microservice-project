{{- $secretName := "django-secrets" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if $existing }}
  secret-key: {{ index $existing.data "secret-key" | b64dec | quote }}
  {{- else }}
  secret-key: {{ .Values.django.secretKey | default (randAlphaNum 50) | quote }}
  {{- end }}
